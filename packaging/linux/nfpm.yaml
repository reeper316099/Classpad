# Linux packages (deb, rpm) for the desktop app, built by scripts/package-desktop.mjs with
# wails3 tool package. Paths are relative to the staging folder the script prepares.
name: classpad
arch: amd64
platform: linux
version: '{{VERSION}}'
section: education
priority: optional
maintainer: Classpad contributors <classpad@users.noreply.github.com>
description: Local-first student workspace
vendor: Classpad contributors
homepage: https://github.com/reeper316099/Classpad
license: MIT
contents:
  - src: ./classpad
    dst: /usr/bin/classpad
  - src: ./classpad.png
    dst: /usr/share/icons/hicolor/256x256/apps/classpad.png
  - src: ./classpad.desktop
    dst: /usr/share/applications/classpad.desktop
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
