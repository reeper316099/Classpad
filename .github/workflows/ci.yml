name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - run: npm run guard -- --all
      - name: Linux libraries for the desktop app (GTK 4, WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # Go: the note editor's core (compiled to WebAssembly for the app), grades, storage and importers
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./cmd/... ./internal/...
      - name: Go tests
        run: go test ./cmd/... ./internal/...
      - name: Go editor core builds for WebAssembly
        shell: bash
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/editorwasm
      - run: npm run lint
      - run: npm run typecheck
      # the API answers as recorded (they matched the TypeScript server's, which is now frozen);
      # macOS runs on arm64, where Go may fuse multiply-adds that JavaScript rounds separately
      - name: Go API server gives the recorded answers
        if: matrix.os != 'windows-latest'
        run: |
          go build -o "$RUNNER_TEMP/classpad-server" ./cmd/classpad-server
          node scripts/api-parity.mjs --go "$RUNNER_TEMP/classpad-server"
      - run: npm test
      # only what ships: build-time tooling is not part of the app
      - run: npm audit --omit=dev --audit-level=moderate
        if: matrix.os == 'ubuntu-latest'

  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - name: Linux libraries for the desktop app (GTK 4, WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build the interface (after the workspace packages it imports)
        run: npm run build && npm run build -w @classpad/web
      # the desktop app checks itself in a hidden window: bridge, in-process API, live updates, interface
      - name: Desktop app self-test
        shell: bash
        run: |
          node scripts/build-desktop.mjs --skip-web --out "$RUNNER_TEMP/classpad-app"
          export CLASSPAD_SELFTEST=1 CLASSPAD_DATA_DIR="$RUNNER_TEMP/selftest-data"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$RUNNER_TEMP/classpad-app"; else "$RUNNER_TEMP/classpad-app"; fi
      # the interface against the Go server in the engines the desktop app uses: WebKit on macOS and
      # Linux, Chromium (WebView2) on Windows
      - name: End-to-end tests (WebKit and Chromium)
        if: runner.os != 'Windows'
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test -c e2e/playwright.config.ts
      - name: End-to-end tests (Chromium, as WebView2)
        if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          npx playwright test -c e2e/playwright.config.ts --project=chromium
      # traces of failed attempts, also when a retry passed (a flaky test still left its trace)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
