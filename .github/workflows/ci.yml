name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run guard -- --all
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # only what ships: build-time tooling (electron-builder) is not part of the app
      - run: npm audit --omit=dev --audit-level=moderate
        if: matrix.os == 'ubuntu-latest'

  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the desktop bundle
        run: npm run bundle -w @classpad/desktop
      - name: End-to-end tests (Linux needs a virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npx playwright test -c e2e/playwright.config.ts
      - name: End-to-end tests
        if: matrix.os != 'ubuntu-latest'
        run: npx playwright test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
