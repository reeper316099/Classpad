name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - run: npm run guard -- --all
      # the note editor's core is Go (compiled to WebAssembly for the app)
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./cmd/... ./internal/...
      - name: Go tests
        run: go test ./cmd/... ./internal/...
      - name: Go editor core builds for WebAssembly
        shell: bash
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/editorwasm
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      # only what ships: build-time tooling (electron-builder) is not part of the app
      - run: npm audit --omit=dev --audit-level=moderate
        if: matrix.os == 'ubuntu-latest'

  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - name: Build the desktop bundle
        run: npm run bundle -w @classpad/desktop
      - name: End-to-end tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test -c e2e/playwright.config.ts
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
