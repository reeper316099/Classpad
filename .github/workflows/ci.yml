name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - run: npm run guard -- --all
      - name: Linux libraries for the desktop app (GTK 4, WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # Go: the note editor's core (compiled to WebAssembly for the app), grades, storage and importers
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./cmd/... ./internal/...
      - name: Go tests
        run: go test ./cmd/... ./internal/...
      - name: Go editor core builds for WebAssembly
        shell: bash
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/editorwasm
      - run: npm run lint
      - run: npm run typecheck
      # typecheck built packages/grades; check the Go engine against it on a fresh set of cases
      - name: Go grade engine matches the TypeScript one
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/grades-parity.mjs --seed 7 --scale 5 --out "$RUNNER_TEMP/parity.json.gz"
          GRADES_PARITY_FILE="$RUNNER_TEMP/parity.json.gz" go test -count=1 -run Parity ./internal/grades
      # the Go store must write the same bytes as packages/jsonstore and read its files, both ways
      - name: Go storage reads and writes the same files as the TypeScript one
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/jsonstore-compat.mjs --seed 7 --count 3000 --out "$RUNNER_TEMP/compat.json"
          JSONSTORE_COMPAT_FILE="$RUNNER_TEMP/compat.json" go test -count=1 -run Compat ./internal/jsonstore
          mkdir "$RUNNER_TEMP/go-data"
          JSONSTORE_GO_OUT="$RUNNER_TEMP/go-data" go test -count=1 -run CompatExport ./internal/jsonstore
          node scripts/jsonstore-compat.mjs --verify "$RUNNER_TEMP/go-data"
      - name: Go importers match the TypeScript ones
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/importers-parity.mjs --seed 7 --scale 3 --out "$RUNNER_TEMP/importers.json.gz"
          IMPORTERS_PARITY_FILE="$RUNNER_TEMP/importers.json.gz" go test -count=1 -run Parity ./internal/importers
      # the same scripted session against both API servers; macOS runs on arm64, where Go may fuse
      # multiply-adds that JavaScript rounds separately
      - name: Go API server answers like the TypeScript one
        if: matrix.os != 'windows-latest'
        run: |
          npx tsc -b packages/server
          go build -o "$RUNNER_TEMP/classpad-server" ./cmd/classpad-server
          node scripts/api-parity.mjs --go "$RUNNER_TEMP/classpad-server"
      - run: npm test
      - run: npm run test:perf
      # only what ships: build-time tooling (electron-builder) is not part of the app
      - run: npm audit --omit=dev --audit-level=moderate
        if: matrix.os == 'ubuntu-latest'

  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - run: npm ci
      - name: Linux libraries for the desktop app (GTK 4, WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build the desktop bundle
        run: npm run bundle -w @classpad/desktop
      # the Wails app checks itself in a hidden window: bridge, in-process API, live updates, interface
      - name: Wails desktop app self-test
        shell: bash
        run: |
          node scripts/build-desktop.mjs --skip-web --out "$RUNNER_TEMP/classpad-app"
          export CLASSPAD_SELFTEST=1 CLASSPAD_DATA_DIR="$RUNNER_TEMP/selftest-data"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$RUNNER_TEMP/classpad-app"; else "$RUNNER_TEMP/classpad-app"; fi
      - name: End-to-end tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test -c e2e/playwright.config.ts
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
