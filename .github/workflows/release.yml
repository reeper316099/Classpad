name: Release
# Push a tag like v0.1.0 to build installers for Windows, macOS and Linux and publish a GitHub release.
# Or run it by hand (Actions → Release → Run workflow), choosing a branch and typing the tag to publish
# under (e.g. v1.3.2); leave the tag empty to only build and keep the installers as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the installers under, e.g. v1.3.2 (created at the chosen commit if missing)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux packaging tools (rpm, deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npm run guard -- --all
      # workspace packages resolve to their built output, so build before the tests
      - run: npm run build
      - run: npm test
      - name: Build installers (unsigned)
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: true
          body: |
            ## Installing
            These builds are **unsigned**, so your OS will warn you the first time:
            - **macOS:** right-click the app → Open (or System Settings → Privacy & Security → Open Anyway).
            - **Windows:** SmartScreen → More info → Run anyway.
            - **Linux:** `chmod +x` the AppImage, or install the `.deb` / `.rpm`.

            Everything stays on your computer. There is no telemetry and no network access.
